on:
  push:
    branches:
      - master
      - release/*
  pull_request:

name: Run Tests

jobs:

  linux-tests:
    name: "Linux Tests"
    strategy:
        fail-fast: false
        matrix:
          container: ["ubuntu:latest", "ubuntu:24.04"]
          node: [20, 22]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install Ubuntu dependencies
        if: ${{ startsWith(matrix.container, 'ubuntu') }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y git build-essential python3

      - name: Install CentOS dependencies
        if: ${{ startsWith(matrix.container, 'centos') }}
        run: |
          yum install -y git gcc gcc-c++ make

      - name: Run tests
        run: |
          npm install --global yarn
          yarn
          yarn test

  macos-tests:
    name: "MacOS Tests"
    strategy:
        matrix:
          node: [20, 22]
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - run: |
          npm install --global yarn
          yarn
          yarn test

  windows-tests:
    name: "Windows Tests"
    strategy:
        matrix:
          node: [20, 22]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      # The node-gyp bundled with npm predates Visual Studio 2026 (18.x), which windows-latest
      # now ships; 12.1.0 is the first release that finds it.
      - name: Use a node-gyp that supports Visual Studio 2026
        run: |
          npm install --global node-gyp@12
          "npm_config_node_gyp=$(npm prefix -g)\node_modules\node-gyp\bin\node-gyp.js" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: |
          npm install --global yarn
          yarn
          yarn test
