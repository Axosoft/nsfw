on:
  push:
    branches:
      - master
      - release/*
  pull_request:

name: Run Tests

permissions:
  contents: read

# A new push to a PR supersedes the previous run; master/release runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # The slow suite (Linux only) and the normal one run in separate jobs so they overlap. The addon is built on
  # Node-API, whose ABI doesn't change between Node versions, so only one job runs the normal suite on every
  # supported Node; the rest run the active LTS.
  linux-tests:
    name: "Linux Tests (${{ matrix.suite }}, ${{ matrix.container }}, ${{ matrix.arch }}, Node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: normal, container: "ubuntu:latest", arch: x64, node: 22 }
          - { suite: normal, container: "ubuntu:latest", arch: x64, node: 24 }
          - { suite: normal, container: "ubuntu:latest", arch: x64, node: 26 }
          - { suite: normal, container: "ubuntu:latest", arch: arm64, node: 26 }
          - { suite: normal, container: "ubuntu:24.04", arch: x64, node: 26 }
          - { suite: slow, container: "ubuntu:latest", arch: x64, node: 26 }
          - { suite: slow, container: "ubuntu:latest", arch: arm64, node: 26 }
          - { suite: slow, container: "ubuntu:24.04", arch: x64, node: 26 }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      # Runs before setup-node: the Node 26+ binaries link libatomic, which the bare
      # Ubuntu image doesn't ship.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y git build-essential python3 libatomic1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Run tests
        id: tests
        env:
          NSFW_TEST_SUITE: ${{ matrix.suite }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # Installs the packed package into an empty project without a lockfile, as `npm install nsfw` does, so
      # dependency ranges resolve to their newest versions instead of the ones pnpm-lock.yaml pins above. Runs even
      # when the tests failed, so both results show. One container per arch is enough: the result doesn't depend on it.
      - name: Install the packed package and watch a directory
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.suite == 'normal' && matrix.container == 'ubuntu:latest' }}
        run: node js/scripts/fresh-install-test.js

  macos-tests:
    name: "MacOS Tests (Node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        # The active LTS; linux-tests covers the other Node versions.
        node: [26]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Run tests
        id: tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # Same as in linux-tests.
      - name: Install the packed package and watch a directory
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node js/scripts/fresh-install-test.js

  windows-tests:
    name: "Windows Tests (Node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        # The active LTS; linux-tests covers the other Node versions.
        node: [26]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Run tests
        id: tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # Same as in linux-tests.
      - name: Install the packed package and watch a directory
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node js/scripts/fresh-install-test.js

  # Single stable check for branch protection, so matrix changes don't require
  # editing the required status checks.
  tests-passed:
    name: "Tests passed"
    if: ${{ always() }}
    needs: [linux-tests, macos-tests, windows-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check matrix results
        run: |
          echo 'linux=${{ needs.linux-tests.result }} macos=${{ needs.macos-tests.result }} windows=${{ needs.windows-tests.result }}'
          test '${{ needs.linux-tests.result }}' = success
          test '${{ needs.macos-tests.result }}' = success
          test '${{ needs.windows-tests.result }}' = success
